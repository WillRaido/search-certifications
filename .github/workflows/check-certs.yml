name: 🏆 Verificar Certificaciones GitHub

on:
  workflow_dispatch:  # Ejecutar manualmente
  schedule:
    - cron: '0 9 * * 1'  # Cada lunes a las 9 AM

jobs:
  check-certifications:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚀 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: 🌐 Instalar Google Chrome
      run: |
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
    - name: 📦 Instalar dependencias
      run: |
        pip install --upgrade pip
        pip install requests beautifulsoup4 selenium
        
    - name: 🔧 Configurar ChromeDriver
      uses: nanasess/setup-chromedriver@v2
        
    - name: 🔍 Buscar certificaciones GitHub
      run: |
        echo "🤖 Iniciando búsqueda con navegador real..."
        python credly_checker.py
      env:
        DISPLAY: ':99.0'
        
    - name: 📊 Mostrar resumen visual
      run: |
        echo "════════════════════════════════════════════════════════════"
        echo "🏆           RESUMEN DE CERTIFICACIONES GITHUB           🏆"
        echo "════════════════════════════════════════════════════════════"
        echo ""
        
        if [ -f "results.json" ]; then
          # Usar Python para procesar el JSON y crear resumen visual
          python3 << 'EOF'
        import json
        import os
        
        try:
            with open('results.json', 'r', encoding='utf-8') as f:
                results = json.load(f)
            
            total_people = len(results)
            found_count = sum(1 for r in results if r['found'])
            total_certs = sum(r['total_certifications'] for r in results)
            
            print(f"📊 ESTADÍSTICAS:")
            print(f"   👥 Personas verificadas: {total_people}")
            print(f"   ✅ Perfiles encontrados: {found_count}")
            print(f"   🏅 Total certificaciones: {total_certs}")
            print("")
            
            # Mostrar cada persona con emojis y colores
            for i, result in enumerate(results, 1):
                if result['found']:
                    print(f"✅ [{i}] {result['name']}")
                    print(f"    🏆 {result['total_certifications']} certificaciones encontradas")
                    
                    if result.get('profile_url'):
                        print(f"    🔗 {result['profile_url']}")
                    
                    # Mostrar certificaciones
                    for cert in result['certifications'][:5]:  # Primeras 5
                        print(f"       • {cert}")
                    
                    if len(result['certifications']) > 5:
                        remaining = len(result['certifications']) - 5
                        print(f"       ... y {remaining} más")
                    
                    print("")
                else:
                    print(f"❌ [{i}] {result['name']}")
                    print(f"    🔍 No encontrado en directorio GitHub")
                    print("")
            
            # Resumen final con barras de progreso ASCII
            if total_people > 0:
                success_rate = (found_count / total_people) * 100
                bar_length = 20
                filled_length = int(bar_length * found_count // total_people)
                bar = '█' * filled_length + '░' * (bar_length - filled_length)
                
                print(f"📈 TASA DE ÉXITO: {success_rate:.1f}%")
                print(f"   [{bar}] {found_count}/{total_people}")
                print("")
            
            # Mensaje motivacional basado en resultados
            if found_count == total_people:
                print("🎉 ¡PERFECTO! Todas las personas tienen certificaciones GitHub")
            elif found_count > 0:
                print(f"👍 ¡Bien! {found_count} personas con certificaciones encontradas")
            else:
                print("🔍 Ninguna certificación encontrada. Verifica los nombres en people.csv")
                
        except Exception as e:
            print(f"❌ Error procesando resultados: {e}")
        EOF
        else
          echo "❌ No se generó archivo results.json"
          echo "🔧 Verifica que people.csv exista y tenga el formato correcto"
        fi
        
        echo ""
