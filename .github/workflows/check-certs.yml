name: Verificar Certificaciones

on:
  workflow_dispatch:  # Ejecutar manualmente
  schedule:
    - cron: '0 9 * * 1'  # Cada lunes a las 9 AM

jobs:
  check-certifications:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4
        
    - name: Run certification check
      run: python credly_checker.py
      
    - name: Upload results
      uses: actions/upload-artifact@v3
      with:
        name: certification-results
        path: results.json
