                .stat-number {{ font-size: 3em; font-weight: bold; margin: 0; }}
                .stat-label {{ color: #666; margin-top: 10px; }}
                .person-card {{ background: white; margin-bottom: 20px; border-radius: 15px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }}
                .person-found {{ border-left: 5px solid #28a745; }}
                .person-not-found {{ border-left: 5px solid #dc3545; }}
                .person-name {{ font-size: 1.5em; font-weight: bold; margin-bottom: 15px; }}
                .cert-list {{ display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }}
                .cert-tag {{ background: #e3f2fd; color: #1976d2; padding: 8px 15px; border-radius: 20px; font-size: 0.9em; }}
                .progress-bar {{ width: 100%; height: 20px; background: #e0e0e0; border-radius: 10px; overflow: hidden; margin-top: 10px; }}
                .progress-fill {{ height: 100%; background: linear-gradient(90deg, #28a745, #20c997); transition: width 0.3s; }}
                .footer {{ text-align: center; margin-top: 40px; color: white; }}
                .method-badge {{ background: #ff9800; color: white; padding: 4px 8px; border-radius: 12px; font-size: 0.8em; margin-left: 10px; }}
            </style>
        </head>
        <body>
            <div class="container">
                <div class="header">
                    <h1>🏆 Reporte de Certificaciones GitHub</h1>
                    <p>📅 Generado: {datetime.now().strftime('%d/%m/%Y a las %H:%M:%S')}</p>
                    <p><span class="method-badge">🤖 NAVEGADOR REAL</span> Selenium + Fallbacks</p>
                </div>
        '''
        
        # Estadísticas
        total_people = len(results)
        found_count = sum(1 for r in results if r['found'])
        total_certs = sum(r['total_certifications'] for r in results)
        success_rate = (found_count / total_people * 100) if total_people > 0 else 0
        
        html += f'''
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-number" style="color: #1976d2;">{total_people}</div>
                        <div class="stat-label">👥 Personas</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" style="color: #28a745;">{found_count}</div>
                        <div class="stat-label">✅ Encontrados</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" style="color: #ff9800;">{total_certs}</div>
                        <div class="stat-label">🏅 Certificaciones</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" style="color: #9c27b0;">{success_rate:.1f}%</div>
                        <div class="stat-label">📈 Éxito</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: {success_rate}%"></div>
                        </div>
                    </div>
                </div>
        '''
        
        # Detalles por persona
        for i, result in enumerate(results, 1):
            status = "person-found" if result['found'] else "person-not-found"
            emoji = "✅" if result['found'] else "❌"
            
            html += f'''
                <div class="person-card {status}">
                    <div class="person-name">{emoji} {result['name']}</div>
            '''
            
            if result['found']:
                html += f'<p>🏆 <strong>{result["total_certifications"]} certificaciones encontradas</strong></p>'
                if result.get('profile_url'):
                    html += f'<p>🔗 <a href="{result["profile_url"]}" target="_blank">Ver perfil en Credly</a></p>'
                
                if result['certifications']:
                    html += '<div class="cert-list">'
                    for cert in result['certifications']:
                        html += f'<span class="cert-tag">{cert}</span>'
                    html += '</div>'
            else:
                html += '<p>🔍 No encontrado en el directorio de GitHub</p>'
            
            html += '</div>'
        
        html += '''
                <div class="footer">
                    <p>Generado automáticamente por GitHub Actions 🤖</p>
                    <p>🔗 Datos obtenidos de credly.com/organizations/github/directory</p>
                    <p>🌐 Usando navegador Chrome real + Selenium</p>
                </div>
            </div>
        </body>
        </html>'''
        
        with open('visual_report.html', 'w', encoding='utf-8') as f:
            f.write(html)
        
        print("✅ Reporte visual HTML generado: visual_report.html")
        EOF
        
    - name: 📤 Subir resultados
      uses: actions/upload-artifact@v4
      with:
        name: 🏆-github-certification-results-selenium
